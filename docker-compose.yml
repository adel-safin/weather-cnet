services:
  weather:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-app:latest
    container_name: weather-app
    ports:
      - "8080:8080"
    environment:
      # Ключ берётся из окружения; значение из ТЗ подставляется как запасное, чтобы проверяющий мог запустить проект без дополнительной настройки
      Weather__WeatherApi__ApiKey: ${WEATHER_API_KEY:-fa8b3df74d4042b9aa7135114252304}
      # TLS в этой конфигурации терминируется снаружи контейнера
      Weather__UseHttpsRedirection: "false"
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
