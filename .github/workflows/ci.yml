name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Кэш пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Проверка форматирования
        run: dotnet format --verify-no-changes --no-restore

      - name: Сборка
        run: dotnet build --configuration Release --no-restore

      - name: Тесты с покрытием
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Отчёт о покрытии
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage" \
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"
          cat artifacts/coverage/Summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Публикация результатов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artifacts/
          retention-days: 7

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: weather-app:ci
          # type=gha нельзя экспортировать драйвером docker, поэтому собираем через Buildx и грузим tar в демон
          outputs: type=docker,dest=/tmp/weather-app.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Загрузка образа
        run: docker load --input /tmp/weather-app.tar

      - name: Проверка запуска контейнера
        run: |
          docker run -d --name weather-ci \
            -p 8080:8080 \
            -e Weather__WeatherApi__ApiKey=ci-placeholder-key \
            -e Weather__UseHttpsRedirection=false \
            weather-app:ci

          # Ключ в CI заведомо нерабочий, поэтому важен сам факт ответа приложения: любой HTTP-код означает, что образ собрался и хост поднялся
          for attempt in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health || true)
            if [ "$status" != "000" ] && [ -n "$status" ]; then
              echo "Приложение ответило кодом $status"
              docker rm --force weather-ci
              exit 0
            fi
            sleep 3
          done

          echo "Приложение не поднялось"
          docker logs weather-ci
          exit 1
